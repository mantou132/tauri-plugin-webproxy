[package]
name = "tauri-plugin-webproxy"
version = "0.1.0"
edition = "2021"
authors = ["mantou132 <709922234@qq.com>"]
license = "MIT"
description = "Tauri plugin to proxy web requests and bypass CSP/X-Frame-Options in webviews"
repository = "https://github.com/mantou132/tauri-plugin-webproxy"
keywords = ["tauri", "plugin", "webproxy", "proxy", "iframe"]
categories = ["gui", "api-bindings", "web-programming"]
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-webproxy"

[dependencies]
tauri = { version = "2.9.2" }
serde = "1.0"
thiserror = "2"
# reqwest 0.13 uses rustls-platform-verifier on Android, which requires extra JNI
# initialization. 0.12 + WebPKI roots stays self-contained inside the Rust plugin.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "cookies", "gzip"] }

[build-dependencies]
tauri-plugin = { version = "2.5.1", features = ["build"] }
